<!DOCTYPE html><html lang='id'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Daily Planner</title>
<style>
body{margin:0;font-family:Inter,Arial;background:linear-gradient(135deg,#eef4ff,#f8faff);color:#223}
.wrap{max-width:1100px;margin:40px auto;padding:20px}
h1{text-align:center;margin:0 0 25px;font-size:42px}
.card{background:#fff;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.08);padding:18px}
.controls{display:grid;grid-template-columns:1fr 160px 160px 120px;gap:10px}
input,select,button{padding:14px;border-radius:12px;border:1px solid #d8deea;font-size:15px}
button{background:#4f46e5;color:#fff;border:none;font-weight:700;cursor:pointer}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}
.col{background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 20px rgba(0,0,0,.06)}
.col h2{margin:0 0 12px}
.drop{min-height:300px}
.task{display:flex;justify-content:space-between;align-items:center;margin:10px 0;padding:12px;border-radius:12px;background:#f8fafc;border-left:7px solid}
.high{border-color:#ef4444}.medium{border-color:#f59e0b}.low{border-color:#22c55e}
.badge{font-size:11px;padding:4px 8px;border-radius:999px;background:#e5e7eb;margin-left:8px}
.del{background:#ef4444;color:#fff;border:none;border-radius:8px;padding:8px 10px}
.empty{color:#94a3b8;text-align:center;padding:30px 0}
</style></head><body><div class='wrap'><h1>✨ Daily Planner</h1>
<div class='card'><div class='controls'>
<input id='txt' placeholder='Tulis pekerjaan...'>
<select id='pri'><option value='high'>🔴 High</option><option value='medium'>🟡 Medium</option><option value='low'>🟢 Low</option></select>
<select id='sec'><option value='today'>🔥 Today</option><option value='tomorrow'>⏰ Tomorrow</option><option value='later'>📌 Later</option></select>
<button onclick='add()'>+ Tambah</button></div></div>
<div class='cols'>
<div class='col'><h2>🔥 Today</h2><div id='today' class='drop'></div></div>
<div class='col'><h2>⏰ Tomorrow</h2><div id='tomorrow' class='drop'></div></div>
<div class='col'><h2>📌 Later</h2><div id='later' class='drop'></div></div>
</div></div>
<script>
function refresh(){['today','tomorrow','later'].forEach(id=>{let d=document.getElementById(id);if(!d.querySelector('.task'))d.innerHTML="<div class='empty'>Belum ada tugas</div>";else{let e=d.querySelector('.empty');if(e)e.remove();}})}
function add(){if(!txt.value.trim())return;let t=document.createElement('div');t.className='task '+pri.value;t.innerHTML="<div>"+txt.value+" <span class='badge'>"+pri.value.toUpperCase()+"</span></div><button class='del' onclick='this.parentNode.remove();refresh()'>✕</button>";let c=document.getElementById(sec.value);let e=c.querySelector('.empty');if(e)e.remove();c.appendChild(t);txt.value='';refresh();}
txt.onkeypress=e=>{if(e.key==='Enter')add()};refresh();
</script></body></html>
