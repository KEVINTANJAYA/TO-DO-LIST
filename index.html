<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Planner</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#eef4ff,#f8faff);
    padding:30px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    font-size:42px;
    margin-bottom:30px;
}

.card{
    background:white;
    padding:20px;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.controls{
    display:grid;
    grid-template-columns:1fr 180px 180px 150px;
    gap:10px;
}

input,
select,
button{
    padding:14px;
    border-radius:12px;
    border:1px solid #d9d9d9;
    font-size:15px;
}

button{
    background:#4f46e5;
    color:white;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:.9;
}

.columns{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-top:25px;
}

.column{
    background:white;
    border-radius:18px;
    padding:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.06);
}

.column h2{
    margin-bottom:15px;
}

.task{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#f8fafc;
    margin-bottom:10px;
    padding:12px;
    border-left:7px solid;
    border-radius:10px;
}

.high{
    border-color:#ef4444;
}

.medium{
    border-color:#f59e0b;
}

.low{
    border-color:#22c55e;
}

.badge{
    background:#e5e7eb;
    padding:4px 8px;
    border-radius:999px;
    font-size:11px;
    margin-left:8px;
}

.delete{
    background:#ef4444;
    color:white;
    border:none;
    border-radius:8px;
    padding:8px 12px;
    cursor:pointer;
}

.empty{
    text-align:center;
    color:#94a3b8;
    margin-top:30px;
}

@media(max-width:900px){

.controls{
grid-template-columns:1fr;
}

.columns{
grid-template-columns:1fr;
}

}
</style>

</head>
<body>

<div class="container">

<h1>✨ Daily Planner</h1>

<div class="card">

<div class="controls">

<input id="taskText" placeholder="Tulis pekerjaan...">

<select id="priority">
<option value="high">🔴 High</option>
<option value="medium">🟡 Medium</option>
<option value="low">🟢 Low</option>
</select>

<select id="section">
<option value="today">🔥 Today</option>
<option value="tomorrow">⏰ Tomorrow</option>
<option value="later">📌 Later</option>
</select>

<button onclick="addTask()">+ Tambah</button>

</div>

</div>

<div class="columns">

<div class="column">
<h2>🔥 Today</h2>
<div id="today"></div>
</div>

<div class="column">
<h2>⏰ Tomorrow</h2>
<div id="tomorrow"></div>
</div>

<div class="column">
<h2>📌 Later</h2>
<div id="later"></div>
</div>

</div>

</div>

<script>

function refresh(){

["today","tomorrow","later"].forEach(function(id){

const area=document.getElementById(id);

if(area.children.length==0){

area.innerHTML="<div class='empty'>Belum ada tugas</div>";

}

});

}

function addTask(){

const text=document.getElementById("taskText").value.trim();

const priority=document.getElementById("priority").value;

const section=document.getElementById("section").value;

if(text=="") return;

const area=document.getElementById(section);

const empty=area.querySelector(".empty");

if(empty) empty.remove();

const task=document.createElement("div");

task.className="task "+priority;

task.innerHTML=`
<div>${text}
<span class="badge">${priority.toUpperCase()}</span>
</div>

<button class="delete">✕</button>
`;

task.querySelector("button").onclick=function(){

task.remove();

refresh();

};

area.appendChild(task);

document.getElementById("taskText").value="";

refresh();

}

document.getElementById("taskText").addEventListener("keypress",function(e){

if(e.key==="Enter"){

addTask();

}

});

refresh();

</script>

</body>
</html>
